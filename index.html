<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Star Catch — built from one prompt</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0c0a16; color: #f7f3ff; font-family: ui-monospace, monospace;
    }
    .wrap { width: min(480px, 100vw); padding: 12px; }
    h1 { font-size: 18px; letter-spacing: .08em; margin: 0 0 8px; color: #ff4fd8; }
    p { font-size: 12px; opacity: .7; margin: 8px 0; }
    canvas {
      width: 100%; height: auto; display: block; border-radius: 14px;
      background: #12102a; box-shadow: 0 0 60px #ff4fd833;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>STAR CATCH</h1>
    <canvas id="game" width="480" height="800" aria-label="Star Catch game"></canvas>
    <p>Move with ← → or your finger. Catch stars, dodge bombs. Built by an AI agent from one prompt on make.fun.</p>
  </div>
  <script type="module">
    import { GAME, createGame, stepGame } from './game.js';
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const game = createGame();
    const keys = { left: false, right: false };
    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'ArrowRight') keys.right = true;
    });
    addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'ArrowRight') keys.right = false;
    });
    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      game.paddle.x = ((e.clientX - rect.left) / rect.width) * GAME.width;
    });

    let last = performance.now();
    function frame(now) {
      const dt = (now - last) / 1000;
      last = now;
      if (keys.left) game.paddle.x -= 420 * dt;
      if (keys.right) game.paddle.x += 420 * dt;
      game.paddle.x = Math.max(GAME.paddleWidth / 2, Math.min(GAME.width - GAME.paddleWidth / 2, game.paddle.x));
      // Keep the autopilot logic for drops, but override paddle with human input when keys are used.
      const before = game.paddle.x;
      stepGame(game, dt);
      if (keys.left || keys.right) game.paddle.x = before;

      ctx.fillStyle = '#12102a';
      ctx.fillRect(0, 0, GAME.width, GAME.height);
      for (const d of game.drops) {
        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.spin);
        ctx.fillStyle = d.kind === 'star' ? '#ffd84d' : '#ff4d6d';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = (i * Math.PI) / 5 - Math.PI / 2;
          const r = i % 2 ? d.r * 0.45 : d.r;
          ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = '#4de8ff';
      ctx.shadowColor = '#4de8ff';
      ctx.shadowBlur = 20;
      ctx.fillRect(game.paddle.x - GAME.paddleWidth / 2, game.paddle.y - 10, GAME.paddleWidth, 20);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#f7f3ff';
      ctx.font = 'bold 24px ui-monospace, monospace';
      ctx.fillText(`SCORE ${game.score}`, 18, 38);
      ctx.fillStyle = '#ff77a8';
      ctx.fillText(`LIVES ${game.lives}`, 340, 38);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
